<html>
<head>
<style>

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

/* 🌌 BACKGROUND */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("background.jpg") center center no-repeat;
    background-size: cover;
    filter: blur(8px) brightness(0.35);
    z-index: 0;
    pointer-events: none;
}

/* 🌑 OVERLAY */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 1;
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.95),
        rgba(0,0,0,0.4),
        rgba(0,0,0,0.2)
    );
    pointer-events: none;
}

/* ✨ PARTICLES */
.particles {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

/* 🧿 UI LAYER (ВАЖНО ДЛЯ GMOD) */
.ui {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 999;
    pointer-events: auto;
    text-align: center;
}

/* LOGO */
.logo {
    margin-top: 80px;
    width: 160px;
    filter: drop-shadow(0 0 25px rgba(120,81,169,0.7));
}

h1 {
    color: rgb(120,81,169);
}

/* BOX */
.box {
    margin-top: 30px;
    display: inline-block;
    padding: 20px 30px;
    border: 1px solid rgba(120,81,169,0.6);
    border-radius: 12px;
    background: rgba(0,0,0,0.5);
}

/* BUTTONS */
.yt-btn {
    padding: 10px 15px;
    background: red;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#music-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 15px;
    background: purple;
    color: white;
    border: none;
    border-radius: 8px;
    z-index: 1000;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>
<div class="particles"></div>

<div class="ui">

    <img class="logo" src="logo.png">

    <h1>СЕРВАК САНИ(●'◡'●)</h1>

    <div class="box">

        <p>Хз че сказатьヾ(•ω•`)o </p>
        <p>Приятной игры c писюном 🎮</p>

        <p>
            ВИДЕО СИСЯСТЫЙ ФЕМБОЙ ЛИЖЕТ ПЯТОЧКИ МАЛЕНЬКОМУ МАЛЬЧИКУ 4k 120FPS:
            <br><br>

            <a href="https://www.youtube.com/watch?v=urBBQOxGDPk">
                <button class="yt-btn">▶ СМОТРЕТЬ БЕСПЛАТНО</button>
            </a>
        </p>

        <p>
            Discord Создателя:
            <a href="https://discord.com/channels/@fleshbacked">Присоединиться</a>
        </p>

    </div>

</div>

<button id="music-btn">🔊 Mute</button>

<audio id="bg-music" loop>
    <source src="music.mp3">
</audio>

<script>

const music = document.getElementById("bg-music");
const btn = document.getElementById("music-btn");

let muted = false;
let started = false;

/* 💥 GMOD SAFE AUTOPLAY */
function startMusic() {
    if (started) return;
    started = true;

    music.volume = 0.3;

    music.play().catch(() => {
        started = false;
    });
}

/* старт */
window.addEventListener("load", startMusic);

/* fallback */
document.addEventListener("click", startMusic);
document.addEventListener("mousemove", startMusic);

/* кнопка */
btn.addEventListener("click", function () {

    muted = !muted;
    music.muted = muted;

    if (!muted) {
        music.play().catch(()=>{});
    }

    btn.innerHTML = muted ? "🔇 Unmute" : "🔊 Mute";
});

</script>

</body>
</html>
